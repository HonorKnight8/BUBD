# 基础设置
cycle_unit_type = "work"
work_minutes = 50
breath_minutes = 10
cycles = 0

# cycle_unit_type 指定程序启动时以该循环单元类型开始（work, breath, rest）
# work_minutes 工作时间
# breath_minutes 小憩时间
# cycles 循环次数，0代表无限循环

# “铃声”设置
work_bell = "brain-implant-cyberpunk-sci-fi-trailer-action-intro-330416.mp3"
work_bell_volume = 75
breath_bell = "background-music-new-age-nature-465069.mp3"
breath_bell_volume = 75
bell_duration = 30

# work_bell 和 breath_bell ，铃声文件，放置于 sounds 文件夹中
# work_bell_volume 和 breath_bell_volume ，自定义铃声音量，数值：1-100
# bell_duration ，自定义铃声播放时间，数值：1-60，单位：秒